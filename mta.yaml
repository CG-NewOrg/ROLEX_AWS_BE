_schema-version: 3.3.0
ID: Rolex-BE
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: Rolex-BE-srv
    type: nodejs
    path: gen/srv

    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: RolexAiCockpit-destination
      - name: AICockpitQ-xsuaa-service
      - name: RolexAiCockpit-connectivity
      - name: Rolex-BE-pg-db

  - name: Rolex-BE-pg-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy
          command: npm start
          memory: 512M
          disk-quota: 1024M
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
    requires:
      - name: Rolex-BE-pg-db

resources:
  - name: RolexAiCockpit-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: RolexAiCockpit-destination

  - name: AICockpitQ-xsuaa-service
    type: org.cloudfoundry.existing-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: AICockpit-xsuaa-service
      path: ./xs-security.json

  - name: RolexAiCockpit-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
      service-name: Rolex-BE-connectivity

  - name: Rolex-BE-pg-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: rlx-central-genai-psql
      service: postgresql-db
      service-plan: standard
